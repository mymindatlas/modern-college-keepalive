name: Supabase Keepalive

on:
  schedule:
    # Every 3 days at 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        id: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          response=$(curl -sS -w '\n%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/settings?select=key&limit=1")

          status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $status"
          echo "Response body: $body"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Keepalive ping succeeded."
            exit 0
          else
            echo "Keepalive ping failed."
            exit 1
          fi

      - name: Log ping and commit
        if: success()
        env:
          STATUS: ${{ steps.ping.outputs.status }}
        run: |
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "${timestamp} - ping succeeded (HTTP ${STATUS})" >> log.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add log.txt
          git commit -m "keepalive: $(date -u +%F) ping"
          git push origin HEAD:${{ github.ref_name }}
